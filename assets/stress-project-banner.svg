<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-labelledby="title desc">
  <title id="title">Stress prediction research workflow</title>
  <desc id="desc">A visual overview of synthetic wearable-style data, baseline delta features, and model evaluation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101b35"/>
      <stop offset="1" stop-color="#102d3a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity=".25"/>
    </filter>
  </defs>
  <rect width="1200" height="350" rx="28" fill="url(#bg)"/>
  <circle cx="1090" cy="-20" r="210" fill="#2563eb" opacity=".10"/>
  <circle cx="30" cy="345" r="170" fill="#2dd4bf" opacity=".08"/>
  <text x="58" y="84" fill="#99f6e4" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="3">STUDENT RESEARCH • MACHINE LEARNING</text>
  <text x="58" y="139" fill="#f8fafc" font-family="Arial,sans-serif" font-size="39" font-weight="700">Stress Prediction</text>
  <text x="58" y="174" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="17">From synthetic wearable-style signals to explainable comparisons</text>
  <rect x="58" y="207" width="172" height="38" rx="19" fill="#123d48" stroke="#2dd4bf" stroke-opacity=".5"/>
  <text x="144" y="232" fill="#99f6e4" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700">600 SYNTHETIC ROWS</text>
  <rect x="242" y="207" width="143" height="38" rx="19" fill="#1c3154" stroke="#60a5fa" stroke-opacity=".5"/>
  <text x="313" y="232" fill="#bfdbfe" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700">17 COLUMNS</text>
  <rect x="397" y="207" width="183" height="38" rx="19" fill="#382c4b" stroke="#c4b5fd" stroke-opacity=".5"/>
  <text x="488" y="232" fill="#ddd6fe" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700">EDUCATIONAL ONLY</text>
  <text x="58" y="300" fill="#94a3b8" font-family="Arial,sans-serif" font-size="13">SIGNALS  →  BASELINE DELTAS  →  MODEL EVALUATION</text>
  <path d="M583 175 H620 M780 175 H817" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
  <path d="m612 168 8 7-8 7 M809 168 817 175l-8 7" fill="none" stroke="#5eead4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <g filter="url(#shadow)">
    <rect x="625" y="83" width="150" height="184" rx="18" fill="#17243c" stroke="#334155"/>
    <rect x="822" y="83" width="150" height="184" rx="18" fill="#17243c" stroke="#334155"/>
    <rect x="1019" y="83" width="150" height="184" rx="18" fill="#17243c" stroke="#334155"/>
  </g>
  <circle cx="653" cy="113" r="9" fill="#2dd4bf"/>
  <text x="644" y="151" fill="#f8fafc" font-family="Arial,sans-serif" font-size="16" font-weight="700">SIGNALS</text>
  <text x="644" y="181" fill="#94a3b8" font-family="Arial,sans-serif" font-size="13">HR · RR · EDA</text>
  <text x="644" y="202" fill="#94a3b8" font-family="Arial,sans-serif" font-size="13">Questionnaires</text>
  <path d="M644 231 h12 l7-13 9 23 9-17 8 7 h20" fill="none" stroke="#2dd4bf" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="850" cy="113" r="9" fill="#60a5fa"/>
  <text x="841" y="151" fill="#f8fafc" font-family="Arial,sans-serif" font-size="16" font-weight="700">BASELINE Δ</text>
  <text x="841" y="181" fill="#94a3b8" font-family="Arial,sans-serif" font-size="13">Task − Resting</text>
  <text x="841" y="202" fill="#94a3b8" font-family="Arial,sans-serif" font-size="13">Compare change</text>
  <text x="841" y="239" fill="#93c5fd" font-family="Arial,sans-serif" font-size="17" font-weight="700">ΔHR · ΔRR</text>
  <circle cx="1047" cy="113" r="9" fill="#c4b5fd"/>
  <text x="1038" y="151" fill="#f8fafc" font-family="Arial,sans-serif" font-size="16" font-weight="700">EVALUATE</text>
  <text x="1038" y="181" fill="#94a3b8" font-family="Arial,sans-serif" font-size="13">CV · Metrics</text>
  <text x="1038" y="202" fill="#94a3b8" font-family="Arial,sans-serif" font-size="13">Plots · Reports</text>
  <rect x="1038" y="224" width="102" height="26" rx="13" fill="#362c50"/>
  <text x="1089" y="242" fill="#ddd6fe" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700">LEARN + EXPLAIN</text>
</svg>
